name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '39 5 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      compatibility: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
