name: verify

on:
  workflow_call:
    inputs:
      compatibility:
        description: Run the older supported Node.js runtime
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @portal-tunnel/x402-sdk exec publint
      - run: pnpm --filter @portal-tunnel/x402-sdk exec attw --pack . --profile node16
      - run: pnpm --filter @portal-tunnel/x402-sdk exec size-limit

  test:
    if: inputs.compatibility
    name: test (node 20)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
