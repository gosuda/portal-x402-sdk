name: Verify CLI discovery resource lifecycle

on:
  push:
    branches: ['ci/verify-portal-discovery-20261126-r7']
    paths: ['.github/workflows/verify-cli-discovery.yml']

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f2f20b1aed7be40152b06a05229fb8a5d082bdec
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portal-tunnel/x402-sdk build
      - name: Prove discovery does not allocate resources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f2f20b1aed7be40152b06a05229fb8a5d082bdec
          test_file=packages/sdk/src/cli/relay-register.test.ts
          cp "$test_file" "$RUNNER_TEMP/candidate-test.ts"
          sha256sum "$test_file"
          git show a6b38999e4725bed0dee11a87c1eb13efbb623a0:"$test_file" > "$test_file"
          mkdir -p "$RUNNER_TEMP/portal-list-before" "$RUNNER_TEMP/portal-list-after"
          TMPDIR="$RUNNER_TEMP/portal-list-before" pnpm --filter @portal-tunnel/x402-sdk exec vitest list src/cli/relay-register.test.ts
          before_count=$(find "$RUNNER_TEMP/portal-list-before" -maxdepth 1 -type d -name 'portal-cli-*' | wc -l)
          test "$before_count" -eq 1
          printf 'BASELINE: discovery leaked %s directory\n' "$before_count"
          cp "$RUNNER_TEMP/candidate-test.ts" "$test_file"
          TMPDIR="$RUNNER_TEMP/portal-list-after" pnpm --filter @portal-tunnel/x402-sdk exec vitest list src/cli/relay-register.test.ts
          after_count=$(find "$RUNNER_TEMP/portal-list-after" -maxdepth 1 -type d -name 'portal-cli-*' | wc -l)
          test "$after_count" -eq 0
          printf 'CANDIDATE: discovery leaked %s directories\n' "$after_count"
          TMPDIR="$RUNNER_TEMP/portal-list-after" pnpm --filter @portal-tunnel/x402-sdk exec vitest run src/cli/relay-register.test.ts
          test "$(find "$RUNNER_TEMP/portal-list-after" -maxdepth 1 -type d -name 'portal-cli-*' | wc -l)" -eq 0
          git diff --exit-code -- "$test_file"
      - run: pnpm --filter @portal-tunnel/x402-sdk typecheck
      - run: pnpm exec biome check packages/sdk/src/cli/relay-register.test.ts
